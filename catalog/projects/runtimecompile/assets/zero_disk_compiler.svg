<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" rx="20" fill="#0F172A"/>
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <text x="200" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">RuntimeCompile Engine</text>
  <text x="200" y="98" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="500" font-size="11" text-anchor="middle">In-Memory JavaCompiler &amp; MemoryClassLoader</text>

  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="240" height="380" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="120" y="36" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">ZERO DISK I/O COMPILATION</text>

    <rect x="16" y="55" width="208" height="60" rx="10" fill="#0F172A"/>
    <text x="26" y="76" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Java Source Code String</text>
    <text x="26" y="96" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10">→ Compiled directly to MemoryFileManager</text>

    <rect x="16" y="125" width="208" height="110" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="26" y="148" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="11">MEMORY CLASS LOAD &amp; EXECUTE</text>
    <text x="26" y="170" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10">1. MemoryClassLoader.loadClass()</text>
    <text x="26" y="188" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10">2. Class.getDeclaredMethod().invoke()</text>
    <text x="26" y="206" fill="#34D399" font-family="system-ui, sans-serif" font-weight="600" font-size="10">✓ Sub-Millisecond Rule Evaluation</text>

    <rect x="16" y="248" width="208" height="115" rx="12" fill="#0F172A"/>
    <text x="26" y="272" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="700" font-size="11">CONCURRENT CACHE</text>
    <text x="26" y="295" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10">✓ Thread-safe compiled class cache</text>
    <text x="26" y="315" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10">✓ Eliminates redundant JIT overhead</text>
    <text x="26" y="340" fill="#10B981" font-family="system-ui, sans-serif" font-weight="600" font-size="10">100% Java Standard Library</text>
  </g>
</svg>
