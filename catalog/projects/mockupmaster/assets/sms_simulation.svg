<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" rx="20" fill="#0F172A"/>
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <text x="200" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">SMS &amp; MMS Simulation</text>
  <text x="200" y="98" fill="#3B82F6" font-family="system-ui, sans-serif" font-weight="500" font-size="11" text-anchor="middle">Multi-Thread Conversation Builder</text>

  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="240" height="380" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="16" y="28" fill="#3B82F6" font-family="system-ui, sans-serif" font-weight="700" font-size="11">SIMULATED CONVERSATION THREAD</text>

    <!-- Incoming Message -->
    <rect x="16" y="45" width="160" height="42" rx="10" fill="#0F172A"/>
    <text x="26" y="62" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10">Hey, is the build ready for testing?</text>
    <text x="26" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8">Received • 10:42 AM</text>

    <!-- Outgoing Message -->
    <rect x="64" y="97" width="160" height="42" rx="10" fill="#2563EB"/>
    <text x="74" y="114" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10">Yes! APK injected with mock data.</text>
    <text x="74" y="128" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="8">Sent • 10:43 AM</text>

    <!-- Incoming MMS Card -->
    <rect x="16" y="149" width="160" height="85" rx="10" fill="#0F172A"/>
    <rect x="24" y="157" width="144" height="45" rx="6" fill="#334155"/>
    <text x="96" y="184" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">🖼️ Image_Attachment.png</text>
    <text x="24" y="222" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8">MMS Received • 10:44 AM</text>

    <!-- CLI Broadcast Engine -->
    <rect x="16" y="248" width="208" height="115" rx="12" fill="#020617" stroke="#3B82F6" stroke-width="1"/>
    <text x="26" y="270" fill="#3B82F6" font-family="system-ui, sans-serif" font-weight="700" font-size="10">HEADLESS ADB CLI BROADCAST</text>
    <text x="26" y="292" fill="#34D399" font-family="system-ui, sans-serif" font-size="9">adb shell am broadcast \</text>
    <text x="26" y="306" fill="#34D399" font-family="system-ui, sans-serif" font-size="9">  -a com.mockup.INJECT_SMS</text>
    <text x="26" y="328" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">CI/CD Pipeline Automation Engine</text>
  </g>
</svg>
