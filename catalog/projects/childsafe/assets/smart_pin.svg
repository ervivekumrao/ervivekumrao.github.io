<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-pin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" rx="20" fill="url(#bg-pin)"/>

  <!-- Phone Mockup -->
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#334155" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <!-- Lock Icon Header -->
  <circle cx="200" cy="110" r="28" fill="#1E293B" stroke="#A855F7" stroke-width="2"/>
  <path d="M192 108 V100 A8 8 0 0 1 208 100 V108 M190 108 H210 V122 H190 Z" stroke="#A855F7" stroke-width="2" fill="none"/>

  <text x="200" y="160" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Smart PIN Security</text>
  <text x="200" y="178" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Keystroke Rhythm Defense</text>

  <!-- PIN Dots Display -->
  <g transform="translate(140, 200)">
    <circle cx="15" cy="10" r="8" fill="#A855F7"/>
    <circle cx="45" cy="10" r="8" fill="#A855F7"/>
    <circle cx="75" cy="10" r="8" fill="#A855F7"/>
    <circle cx="105" cy="10" r="8" fill="#334155"/>
  </g>

  <!-- Rhythm Graph (Typing Speed Waveform) -->
  <rect x="80" y="240" width="240" height="64" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="96" y="260" fill="#CBD5E1" font-family="system-ui, sans-serif" font-weight="600" font-size="10">RHYTHM TIMING PATTERN MATCH</text>
  <path d="M96 285 Q116 265, 136 285 T176 285 T216 270 T256 290 T296 280" stroke="#A855F7" stroke-width="2" fill="none"/>

  <!-- Keypad Buttons -->
  <g transform="translate(90, 320)">
    <circle cx="30" cy="24" r="20" fill="#1E293B"/>
    <text x="30" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="16" text-anchor="middle">1</text>

    <circle cx="110" cy="24" r="20" fill="#1E293B"/>
    <text x="110" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="16" text-anchor="middle">2</text>

    <circle cx="190" cy="24" r="20" fill="#1E293B"/>
    <text x="190" y="30" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="16" text-anchor="middle">3</text>

    <circle cx="30" cy="74" r="20" fill="#1E293B"/>
    <text x="30" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="16" text-anchor="middle">4</text>

    <circle cx="110" cy="74" r="20" fill="#1E293B"/>
    <text x="110" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="16" text-anchor="middle">5</text>

    <circle cx="190" cy="74" r="20" fill="#1E293B"/>
    <text x="190" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="16" text-anchor="middle">6</text>
  </g>

  <!-- Biometric Unlock Indicator -->
  <rect x="80" y="460" width="240" height="44" rx="14" fill="#0F172A" stroke="#A855F7" stroke-width="1.5"/>
  <path d="M110 482 A8 8 0 0 1 126 482 M112 478 A12 12 0 0 1 124 478 M114 486 A4 4 0 0 1 122 486" stroke="#A855F7" stroke-width="2" fill="none"/>
  <text x="138" y="487" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Biometrics &amp; Fingerprint Enabled</text>
</svg>
