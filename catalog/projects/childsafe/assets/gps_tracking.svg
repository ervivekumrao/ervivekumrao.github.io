<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <filter id="glow-pin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2A9D8F" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="400" height="600" rx="20" fill="url(#bg-gps)"/>

  <!-- Phone Mockup -->
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#334155" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <!-- Map Graphic Area -->
  <g transform="translate(62, 42)">
    <clipPath id="screen-clip">
      <rect width="276" height="516" rx="26"/>
    </clipPath>
    <g clip-path="url(#screen-clip)">
      <!-- Map Background Roads -->
      <rect width="276" height="516" fill="#0B132B"/>
      <path d="M-20 150 C100 180, 150 100, 300 140" stroke="#1E293B" stroke-width="24" fill="none"/>
      <path d="M120 -10 V530" stroke="#1E293B" stroke-width="18" fill="none"/>
      <path d="M-10 320 H290" stroke="#1E293B" stroke-width="20" fill="none"/>

      <!-- Secondary Streets -->
      <path d="M-20 150 C100 180, 150 100, 300 140" stroke="#334155" stroke-width="8" fill="none"/>
      <path d="M120 -10 V530" stroke="#334155" stroke-width="6" fill="none"/>
      <path d="M-10 320 H290" stroke="#334155" stroke-width="6" fill="none"/>

      <!-- Route Trace Line -->
      <path d="M60 400 L120 320 L120 160 L180 140" stroke="#38BDF8" stroke-width="4" stroke-dasharray="6 4" fill="none"/>

      <!-- Periodic History Snapshot Dots -->
      <circle cx="60" cy="400" r="5" fill="#38BDF8"/>
      <circle cx="120" cy="320" r="5" fill="#38BDF8"/>
      <circle cx="120" cy="160" r="5" fill="#38BDF8"/>

      <!-- Live Target Marker Pulse -->
      <circle cx="180" cy="140" r="32" fill="#2A9D8F" fill-opacity="0.25"/>
      <circle cx="180" cy="140" r="18" fill="#2A9D8F" fill-opacity="0.4"/>
      <circle cx="180" cy="140" r="8" fill="#38BDF8" filter="url(#glow-pin)"/>

      <!-- Top Overlay Header -->
      <rect x="16" y="24" width="244" height="44" rx="14" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <circle cx="36" cy="46" r="6" fill="#10B981"/>
      <text x="50" y="44" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Live Location Polling</text>
      <text x="50" y="58" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Interval: 5 min snapshots</text>

      <!-- Bottom Card: Current Address -->
      <rect x="16" y="416" width="244" height="80" rx="16" fill="#0F172A" fill-opacity="0.95" stroke="#334155" stroke-width="1"/>
      <text x="32" y="440" fill="#2A9D8F" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="0.5">CURRENT LOCATION</text>
      <text x="32" y="460" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="14">Lincoln Elementary School</text>
      <text x="32" y="478" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Accuracy: ± 4 meters • Updated 1m ago</text>
    </g>
  </g>
</svg>
