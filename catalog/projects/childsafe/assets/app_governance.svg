<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gov" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" rx="20" fill="url(#bg-gov)"/>

  <!-- Phone Mockup -->
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#334155" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <!-- Header -->
  <text x="200" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">App &amp; Permission Governance</text>
  <text x="200" y="98" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="500" font-size="11" text-anchor="middle">Suspend, Hide &amp; Grant/Deny Rights</text>

  <!-- App Controls Group -->
  <g transform="translate(80, 120)">
    <!-- App Header Box -->
    <rect x="0" y="0" width="240" height="50" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <rect x="12" y="10" width="30" height="30" rx="8" fill="#E11D48"/>
    <text x="50" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Social Video App</text>
    <text x="50" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">com.target.social.app</text>

    <!-- State Toggles -->
    <rect x="0" y="60" width="240" height="130" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>

    <!-- Toggle 1: Suspend App -->
    <text x="16" y="86" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Suspend App State</text>
    <rect x="180" y="72" width="44" height="20" rx="10" fill="#DC2626"/>
    <circle cx="214" cy="82" r="8" fill="#ffffff"/>

    <!-- Toggle 2: Hide Launcher Icon -->
    <text x="16" y="126" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Hide Launcher Icon</text>
    <rect x="180" y="112" width="44" height="20" rx="10" fill="#2563EB"/>
    <circle cx="214" cy="122" r="8" fill="#ffffff"/>

    <!-- Toggle 3: Force Uninstall -->
    <text x="16" y="166" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Remote Uninstall</text>
    <rect x="170" y="152" width="54" height="24" rx="6" fill="#E11D48"/>
    <text x="197" y="168" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">Remove</text>
  </g>

  <!-- Runtime Permissions Card -->
  <g transform="translate(80, 320)">
    <rect x="0" y="0" width="240" height="160" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="0.5">RUNTIME PERMISSION POLICY</text>

    <!-- Camera: Deny -->
    <text x="16" y="55" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Camera Access</text>
    <rect x="160" y="40" width="64" height="22" rx="11" fill="#DC2626" fill-opacity="0.2" stroke="#DC2626" stroke-width="1"/>
    <text x="192" y="55" fill="#F87171" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">DENIED</text>

    <!-- Microphone: Deny -->
    <text x="16" y="90" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Microphone Access</text>
    <rect x="160" y="75" width="64" height="22" rx="11" fill="#DC2626" fill-opacity="0.2" stroke="#DC2626" stroke-width="1"/>
    <text x="192" y="90" fill="#F87171" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">DENIED</text>

    <!-- Contacts: Allow -->
    <text x="16" y="125" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Contacts Access</text>
    <rect x="160" y="110" width="64" height="22" rx="11" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <text x="192" y="125" fill="#34D399" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">ALLOWED</text>
  </g>
</svg>
