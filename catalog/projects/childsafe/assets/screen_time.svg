<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-time" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="bar-warn" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
    <filter id="shadow-time" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="600" rx="20" fill="url(#bg-time)"/>

  <!-- Phone Mockup -->
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#334155" stroke-width="4" filter="url(#shadow-time)"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <!-- Top Title -->
  <text x="200" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Daily Usage Quotas</text>
  <text x="200" y="98" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Weekly Screen Allowance</text>

  <!-- Circular Progress Ring (Today's Limit: 1h 45m / 2h 00m) -->
  <circle cx="200" cy="180" r="54" fill="none" stroke="#1E293B" stroke-width="10"/>
  <circle cx="200" cy="180" r="54" fill="none" stroke="#38BDF8" stroke-width="10" stroke-dasharray="339.29" stroke-dashoffset="60" stroke-linecap="round" transform="rotate(-90 200 180)"/>
  <text x="200" y="176" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="800" font-size="22" text-anchor="middle">1h 45m</text>
  <text x="200" y="196" fill="#94A3B8" font-family="system-ui, sans-serif" font-weight="500" font-size="11" text-anchor="middle">of 2h limit remaining</text>

  <!-- Bar Graph Section -->
  <rect x="80" y="260" width="240" height="180" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="96" y="285" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="13">Per-Day Usage (Mon-Sun)</text>

  <!-- Bars -->
  <!-- Mon: 1.5h -->
  <rect x="96" y="340" width="18" height="60" rx="4" fill="url(#bar-grad)"/>
  <text x="105" y="420" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">M</text>

  <!-- Tue: 1.2h -->
  <rect x="126" y="352" width="18" height="48" rx="4" fill="url(#bar-grad)"/>
  <text x="135" y="420" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">T</text>

  <!-- Wed: 1.8h -->
  <rect x="156" y="328" width="18" height="72" rx="4" fill="url(#bar-grad)"/>
  <text x="165" y="420" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">W</text>

  <!-- Thu: 1.0h -->
  <rect x="186" y="360" width="18" height="40" rx="4" fill="url(#bar-grad)"/>
  <text x="195" y="420" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">T</text>

  <!-- Fri: 2.0h (Limit) -->
  <rect x="216" y="320" width="18" height="80" rx="4" fill="url(#bar-warn)"/>
  <text x="225" y="420" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">F</text>

  <!-- Sat: 3.0h Weekend Extended -->
  <rect x="246" y="300" width="18" height="100" rx="4" fill="url(#bar-grad)"/>
  <text x="255" y="420" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">S</text>

  <!-- Sun: 2.5h Weekend Extended -->
  <rect x="276" y="312" width="18" height="88" rx="4" fill="url(#bar-grad)"/>
  <text x="285" y="420" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">S</text>

  <!-- Bedtime Lock Schedule Banner -->
  <rect x="80" y="455" width="240" height="50" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <path d="M100 480 A10 10 0 1 0 115 470 A12 12 0 1 1 100 480 Z" fill="#F4A261"/>
  <text x="126" y="477" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Bedtime Lock Active</text>
  <text x="126" y="493" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Locks 9:00 PM – 7:00 AM</text>
</svg>
