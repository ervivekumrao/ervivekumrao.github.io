<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-rem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="btn-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="btn-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" rx="20" fill="url(#bg-rem)"/>

  <!-- Phone Mockup -->
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#334155" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <!-- Title Header -->
  <text x="200" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Remote Device Commands</text>
  <text x="200" y="98" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="500" font-size="11" text-anchor="middle">Instant Encrypted DPM Dispatch</text>

  <!-- Remote Password Reset Card -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="240" height="150" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="30" cy="30" r="16" fill="#2563EB" fill-opacity="0.2"/>
    <path d="M26 26 V22 A4 4 0 0 1 34 22 V26 M24 26 H36 V36 H24 Z" stroke="#38BDF8" stroke-width="2" fill="none"/>
    <text x="56" y="28" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Remote Password Reset</text>
    <text x="56" y="42" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Change device lock PIN instantly</text>

    <!-- New Password Field Mock -->
    <rect x="16" y="60" width="208" height="36" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="30" y="82" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="14" letter-spacing="4">••••••</text>
    <text x="160" y="82" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Set PIN</text>

    <rect x="16" y="106" width="208" height="32" rx="8" fill="url(#btn-blue)"/>
    <text x="120" y="126" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Dispatch Remote Lock Command</text>
  </g>

  <!-- Remote Device Reboot Card -->
  <g transform="translate(80, 290)">
    <rect x="0" y="0" width="240" height="130" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="30" cy="30" r="16" fill="#DC2626" fill-opacity="0.2"/>
    <path d="M24 30 A6 6 0 1 1 34 30 M30 22 V27" stroke="#F87171" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="56" y="28" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Remote Device Restart</text>
    <text x="56" y="42" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Reboot child device remotely</text>

    <rect x="16" y="70" width="208" height="38" rx="10" fill="url(#btn-red)"/>
    <text x="120" y="94" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Restart Child Device Now</text>
  </g>

  <!-- Encryption Status Indicator -->
  <rect x="80" y="445" width="240" height="44" rx="12" fill="#020617" stroke="#2563EB" stroke-width="1"/>
  <circle cx="100" cy="467" r="6" fill="#10B981"/>
  <text x="114" y="465" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Cloud Sync Active</text>
  <text x="114" y="478" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">TLS 1.3 Encrypted Pipe</text>
</svg>
