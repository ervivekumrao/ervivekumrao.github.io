<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-restr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" rx="20" fill="url(#bg-restr)"/>

  <!-- Phone Mockup -->
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#334155" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <!-- Header Badge -->
  <rect x="80" y="70" width="240" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <path d="M100 83 L106 100 L120 100 L108 108 L112 122 L100 112 L88 122 L92 108 L80 100 L94 100 Z" fill="#38BDF8" transform="scale(0.5) translate(80, 70)"/>
  <text x="125" y="94" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="13">50+ DPM Policy Controls</text>

  <!-- Restrictions List Cards -->
  <g transform="translate(80, 130)">
    <!-- Item 1: Factory Reset -->
    <rect x="0" y="0" width="240" height="56" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="16" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Disallow Factory Reset</text>
    <text x="16" y="42" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Blocks wipe &amp; reset bypass</text>
    <rect x="180" y="18" width="44" height="20" rx="10" fill="#2563EB"/>
    <circle cx="214" cy="28" r="8" fill="#ffffff"/>

    <!-- Item 2: USB File Transfer -->
    <rect x="0" y="66" width="240" height="56" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="16" y="92" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Disallow USB Transfer</text>
    <text x="16" y="108" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Blocks MTP &amp; ADB debugging</text>
    <rect x="180" y="84" width="44" height="20" rx="10" fill="#2563EB"/>
    <circle cx="214" cy="94" r="8" fill="#ffffff"/>

    <!-- Item 3: Camera & Mic -->
    <rect x="0" y="132" width="240" height="56" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="16" y="158" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Disallow Camera &amp; Mic</text>
    <text x="16" y="174" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Hardware sensor lockdown</text>
    <rect x="180" y="150" width="44" height="20" rx="10" fill="#2563EB"/>
    <circle cx="214" cy="160" r="8" fill="#ffffff"/>

    <!-- Item 4: Wi-Fi / Bluetooth -->
    <rect x="0" y="198" width="240" height="56" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="16" y="224" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Disallow State Alteration</text>
    <text x="16" y="240" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Wi-Fi, Bluetooth &amp; Airplane Mode</text>
    <rect x="180" y="216" width="44" height="20" rx="10" fill="#2563EB"/>
    <circle cx="214" cy="226" r="8" fill="#ffffff"/>

    <!-- Item 5: Unknown Sources -->
    <rect x="0" y="264" width="240" height="56" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="16" y="290" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Disallow Unknown APKs</text>
    <text x="16" y="306" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Blocks sideloading untrusted apps</text>
    <rect x="180" y="282" width="44" height="20" rx="10" fill="#2563EB"/>
    <circle cx="214" cy="292" r="8" fill="#ffffff"/>
  </g>

  <!-- Bottom Enforcement Shield Badge -->
  <rect x="80" y="470" width="240" height="46" rx="14" fill="#020617" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="200" y="497" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">🛡️ Device Owner Enforced</text>
</svg>
