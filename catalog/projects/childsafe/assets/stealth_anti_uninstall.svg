<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-stealth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" rx="20" fill="url(#bg-stealth)"/>

  <!-- Phone Mockup -->
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#334155" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <!-- Header -->
  <text x="200" y="78" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle">Stealth &amp; Anti-Uninstall</text>
  <text x="200" y="96" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="500" font-size="10" text-anchor="middle">Icon Hiding &amp; Removal Lock</text>

  <!-- Card 1: Stealth Mode (Show/Hide Icon) -->
  <g transform="translate(80, 115)">
    <rect x="0" y="0" width="240" height="115" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="0.5">STEALTH LAUNCHER MODE</text>

    <text x="16" y="52" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Child Safe App Icon</text>
    <rect x="166" y="38" width="58" height="22" rx="11" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <text x="195" y="53" fill="#34D399" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">HIDDEN</text>

    <!-- Wrapped Description Lines -->
    <text x="16" y="78" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">App launcher icon is hidden from child</text>
    <text x="16" y="94" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">app drawer and home screen.</text>
  </g>

  <!-- Card 2: System App Info Screen Mockup (Disabled Uninstall Button) -->
  <g transform="translate(80, 245)">
    <rect x="0" y="0" width="240" height="245" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="0.5">SYSTEM APP INFO LOCK</text>

    <!-- App Header -->
    <rect x="16" y="40" width="32" height="32" rx="8" fill="#0F4C81"/>
    <text x="56" y="54" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Child Safe</text>
    <text x="56" y="66" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">control.child.device • v3.0.2</text>

    <!-- Buttons Row -->
    <!-- Open (Active) -->
    <rect x="16" y="88" width="96" height="36" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="64" y="110" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Open</text>

    <!-- Uninstall (DISABLED / GRAYED OUT WITH LOCK) -->
    <rect x="124" y="88" width="100" height="36" rx="8" fill="#0F172A" fill-opacity="0.4" stroke="#475569" stroke-width="1" stroke-dasharray="3"/>
    <path d="M136 106 V102 A3 3 0 0 1 142 102 V106 M134 106 H144 V114 H134 Z" stroke="#64748B" stroke-width="1.5" fill="none"/>
    <text x="172" y="110" fill="#64748B" font-family="system-ui, sans-serif" font-weight="600" font-size="10" text-anchor="middle">Uninstall</text>

    <!-- Force Stop (DISABLED) -->
    <rect x="16" y="134" width="208" height="32" rx="8" fill="#0F172A" fill-opacity="0.4" stroke="#475569" stroke-width="1" stroke-dasharray="3"/>
    <text x="120" y="154" fill="#64748B" font-family="system-ui, sans-serif" font-weight="600" font-size="10" text-anchor="middle">Force stop (Disabled by Policy)</text>

    <!-- Protection Footer -->
    <rect x="16" y="180" width="208" height="48" rx="8" fill="#0F172A"/>
    <text x="24" y="198" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="10">🛡️ Device Policy Enforced</text>
    <text x="24" y="214" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">System prevents app removal.</text>
  </g>
</svg>
