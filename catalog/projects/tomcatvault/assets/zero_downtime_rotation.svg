<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="16" fill="#0F172A"/>
  <rect x="8" y="8" width="384" height="244" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="200" y="32" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle">ZERO-DOWNTIME HOT CREDENTIAL ROTATION</text>

  <!-- Flow Boxes -->
  <g transform="translate(20, 48)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="110" height="80" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <text x="55" y="24" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">1. Key Rotation</text>
    <text x="55" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Secret update or</text>
    <text x="55" y="58" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">file timestamp</text>

    <!-- Arrow 1 -->
    <text x="122" y="45" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="14">➔</text>

    <!-- Box 2 -->
    <rect x="135" y="0" width="110" height="80" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="190" y="24" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">2. Reloader</text>
    <text x="190" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">VaultCredential</text>
    <text x="190" y="58" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Reloader evicts</text>

    <!-- Arrow 2 -->
    <text x="257" y="45" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="14">➔</text>

    <!-- Box 3 -->
    <rect x="270" y="0" width="90" height="80" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="315" y="24" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">3. Live Pool</text>
    <text x="315" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Pool connections</text>
    <text x="315" y="58" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">re-authenticated</text>
  </g>

  <!-- Bottom Details -->
  <rect x="20" y="146" width="360" height="90" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="200" y="168" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Zero Tomcat Restart Required</text>
  <text x="200" y="188" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">HikariCP &amp; DBCP2 pools flushed gracefully in memory</text>
  <text x="200" y="206" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Includes CLI re-encrypt tool for context.xml key migration</text>
  <text x="200" y="224" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">✓ Bounded reflection cache prevents allocation overhead</text>
</svg>