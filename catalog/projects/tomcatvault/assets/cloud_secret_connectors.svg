<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="16" fill="#0F172A"/>
  <rect x="8" y="8" width="384" height="244" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="200" y="32" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle">CLOUD SECRET MANAGER CONNECTORS</text>

  <!-- Connectors Grid -->
  <g transform="translate(20, 48)">
    <!-- AWS -->
    <rect x="0" y="0" width="170" height="42" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <text x="12" y="18" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="700" font-size="10">AWS Secrets Manager</text>
    <text x="12" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">AWS_SECRET(path#key)</text>

    <!-- HashiCorp Vault -->
    <rect x="190" y="0" width="170" height="42" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="1"/>
    <text x="202" y="18" fill="#06B6D4" font-family="system-ui, sans-serif" font-weight="700" font-size="10">HashiCorp Vault</text>
    <text x="202" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">VAULT(path#key)</text>

    <!-- Azure Key Vault -->
    <rect x="0" y="50" width="170" height="42" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
    <text x="12" y="68" fill="#3B82F6" font-family="system-ui, sans-serif" font-weight="700" font-size="10">Azure Key Vault</text>
    <text x="12" y="82" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">AZURE_VAULT(name)</text>

    <!-- GCP Secret Manager -->
    <rect x="190" y="50" width="170" height="42" rx="8" fill="#1E293B" stroke="#EA4335" stroke-width="1"/>
    <text x="202" y="68" fill="#EA4335" font-family="system-ui, sans-serif" font-weight="700" font-size="10">GCP Secret Manager</text>
    <text x="202" y="82" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">GCP_SECRET(name)</text>
  </g>

  <!-- TTL Cache Shield -->
  <rect x="20" y="152" width="360" height="84" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="200" y="174" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">In-Memory TTL Caching Shield</text>
  <text x="200" y="194" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Prevents Cloud API Rate Limits &amp; Eliminates Latency Spikes</text>
  <text x="200" y="214" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="600" font-size="10" text-anchor="middle">Configurable TTL (Default: 300,000ms / 5 min)</text>
</svg>