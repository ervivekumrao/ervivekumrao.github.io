<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="16" fill="#0F172A"/>
  <rect x="10" y="10" width="380" height="240" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>

  <!-- Main Section Title -->
  <text x="200" y="35" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">CLOUD SECRET MANAGER CONNECTORS</text>

  <!-- Connectors Grid (2x2) -->
  <!-- Left Box 1: AWS Secrets Manager -->
  <rect x="20" y="50" width="172" height="44" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="106" y="67" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">AWS Secrets Manager</text>
  <text x="106" y="83" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">AWS_SECRET(path#key)</text>

  <!-- Right Box 1: HashiCorp Vault -->
  <rect x="208" y="50" width="172" height="44" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="1"/>
  <text x="294" y="67" fill="#06B6D4" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">HashiCorp Vault</text>
  <text x="294" y="83" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">VAULT(path#key)</text>

  <!-- Left Box 2: Azure Key Vault -->
  <rect x="20" y="102" width="172" height="44" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
  <text x="106" y="119" fill="#3B82F6" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">Azure Key Vault</text>
  <text x="106" y="135" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">AZURE_VAULT(name)</text>

  <!-- Right Box 2: GCP Secret Manager -->
  <rect x="208" y="102" width="172" height="44" rx="8" fill="#1E293B" stroke="#EA4335" stroke-width="1"/>
  <text x="294" y="119" fill="#EA4335" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">GCP Secret Manager</text>
  <text x="294" y="135" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">GCP_SECRET(name)</text>

  <!-- Bottom TTL Cache Banner Box -->
  <rect x="20" y="156" width="360" height="80" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="200" y="176" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">In-Memory TTL Caching Shield</text>
  <text x="200" y="196" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Prevents Cloud API Rate Limits &amp; Eliminates Latency Spikes</text>
  <text x="200" y="216" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="600" font-size="10" text-anchor="middle">Configurable TTL (Default: 300,000ms / 5 min)</text>
</svg>