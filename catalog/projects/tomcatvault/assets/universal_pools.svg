<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="16" fill="#0F172A"/>
  <rect x="10" y="10" width="380" height="240" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>

  <!-- Main Section Title -->
  <text x="200" y="35" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">UNIVERSAL DATASOURCE CONNECTION POOLS</text>

  <!-- Factories Grid (2x2) -->
  <!-- Left Box 1: HikariCP -->
  <rect x="20" y="50" width="172" height="44" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="106" y="67" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" text-anchor="middle">HikariCP Pool</text>
  <text x="106" y="83" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">VaultHikariDataSourceFactory</text>

  <!-- Right Box 1: Tomcat DBCP2 -->
  <rect x="208" y="50" width="172" height="44" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="294" y="67" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" text-anchor="middle">Tomcat DBCP2 Pool</text>
  <text x="294" y="83" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">VaultBasicDataSourceFactory</text>

  <!-- Left Box 2: Tomcat JDBC -->
  <rect x="20" y="102" width="172" height="44" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="106" y="119" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" text-anchor="middle">Tomcat JDBC Pool</text>
  <text x="106" y="135" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">VaultDataSourceFactory</text>

  <!-- Right Box 2: Vibur & C3P0 Adapter -->
  <rect x="208" y="102" width="172" height="44" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="294" y="119" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" text-anchor="middle">Vibur &amp; C3P0 Adapter</text>
  <text x="294" y="135" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">VaultGenericDataSourceFactory</text>

  <!-- Bottom Enterprise Banner Box -->
  <rect x="20" y="156" width="360" height="80" rx="10" fill="#0F172A" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="200" y="176" fill="#14B8A6" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Seamless Enterprise Integration</text>
  <text x="200" y="196" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Drop-in replacement for standard Tomcat ObjectFactories in context.xml</text>
  <text x="200" y="216" fill="#10B981" font-family="system-ui, sans-serif" font-weight="600" font-size="10" text-anchor="middle">✓ Compatible with Apache Tomcat 7, 8, 8.5, 9, 10, 10.1 &amp; 11</text>
