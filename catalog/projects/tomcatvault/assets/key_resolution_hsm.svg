<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="16" fill="#0F172A"/>
  <rect x="8" y="8" width="384" height="244" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="200" y="32" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle">KEY RESOLUTION HIERARCHY &amp; HSM</text>

  <!-- Flow Items -->
  <g transform="translate(20, 50)">
    <!-- Node 1: System Prop -->
    <rect x="0" y="0" width="170" height="42" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="12" y="18" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="10">1. System Property</text>
    <text x="12" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">-Dtomcat.vault.key</text>

    <!-- Node 2: Env Var -->
    <rect x="190" y="0" width="170" height="42" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="202" y="18" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="10">2. Environment Var</text>
    <text x="202" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">TOMCAT_VAULT_KEY</text>

    <!-- Node 3: K8s File -->
    <rect x="0" y="52" width="170" height="42" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="12" y="70" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10">3. Kubernetes Secret</text>
    <text x="12" y="84" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">FileKeyProvider (Auto-Reload)</text>

    <!-- Node 4: KeyStore HSM -->
    <rect x="190" y="52" width="170" height="42" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="202" y="70" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10">4. KeyStore / HSM</text>
    <text x="202" y="84" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">PKCS#12 / JKS FIPS 140-2</text>
  </g>

  <!-- Composite Provider Badge -->
  <rect x="20" y="156" width="360" height="80" rx="10" fill="#0F172A" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="200" y="178" fill="#14B8A6" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">CompositeKeyProvider Evaluation</text>
  <text x="200" y="198" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Strict Priority Chain • Key Version Tag Matching (v1, v2)</text>
  <text x="200" y="216" fill="#10B981" font-family="system-ui, sans-serif" font-weight="600" font-size="10" text-anchor="middle">✓ Zero Plaintext Key Leakage</text>
</svg>