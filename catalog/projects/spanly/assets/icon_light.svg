<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Spanly Logo Symbol</title>
  <defs>
    <linearGradient id="spanGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="symbolGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Clock Track Background Circle -->
  <circle cx="128" cy="128" r="92" fill="none" stroke="#E2E8F0" stroke-width="14" stroke-dasharray="6 6"/>

  <!-- 'S' Time Span Arc -->
  <path fill="none" stroke="url(#spanGradPrimary)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#symbolGlow)"
        d="M 172 70 A 46 46 0 0 0 82 84 C 82 118 174 138 174 172 A 46 46 0 0 1 84 186"/>

  <!-- Start Handle -->
  <circle cx="172" cy="70" r="15" fill="#FFFFFF" stroke="#6366F1" stroke-width="6"/>
  <circle cx="172" cy="70" r="5" fill="#6366F1"/>

  <!-- End Handle -->
  <circle cx="84" cy="186" r="15" fill="#FFFFFF" stroke="#06B6D4" stroke-width="6"/>
  <circle cx="84" cy="186" r="5" fill="#06B6D4"/>

  <!-- Cardinal Hour Ticks -->
  <circle cx="128" cy="22" r="3" fill="#94A3B8"/>
  <circle cx="234" cy="128" r="3" fill="#94A3B8"/>
  <circle cx="128" cy="234" r="3" fill="#94A3B8"/>
  <circle cx="22" cy="128" r="3" fill="#94A3B8"/>
</svg>
