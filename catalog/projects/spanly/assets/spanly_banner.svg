<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title">
  <title id="title">Spanly README Banner</title>
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#818CF8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width="1200" height="400" fill="url(#bannerBg)"/>

  <!-- Decorative Dial Background Accents -->
  <circle cx="1080" cy="200" r="260" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="12 12" opacity="0.35"/>
  <circle cx="1080" cy="200" r="170" fill="none" stroke="#475569" stroke-width="2" opacity="0.2"/>
  <circle cx="120" cy="80" r="110" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.25"/>

  <!-- Left Logo Symbol (Centered Vertically at X: 85, Y: 76) -->
  <g transform="translate(85, 76) scale(0.97)">
    <circle cx="128" cy="128" r="92" fill="none" stroke="#334155" stroke-width="14" stroke-dasharray="6 6"/>
    <path fill="none" stroke="url(#bannerGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#bannerGlow)"
          d="M 172 70 A 46 46 0 0 0 82 84 C 82 118 174 138 174 172 A 46 46 0 0 1 84 186"/>
    <circle cx="172" cy="70" r="15" fill="#0F172A" stroke="#818CF8" stroke-width="6"/>
    <circle cx="172" cy="70" r="5" fill="#818CF8"/>
    <circle cx="84" cy="186" r="15" fill="#0F172A" stroke="#22D3EE" stroke-width="6"/>
    <circle cx="84" cy="186" r="5" fill="#22D3EE"/>
    <circle cx="128" cy="22" r="3.5" fill="#64748B"/>
    <circle cx="234" cy="128" r="3.5" fill="#64748B"/>
    <circle cx="128" cy="234" r="3.5" fill="#64748B"/>
    <circle cx="22" cy="128" r="3.5" fill="#64748B"/>
  </g>

  <!-- Right Typography & Branding Group (X: 350, Y: 100) -->
  <g transform="translate(350, 100)">
    <!-- WORDMARK "Spanly" Outlined Vector Letters -->
    <g fill="#F8FAFC">
      <!-- Letter S -->
      <path fill="none" stroke="#F8FAFC" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"
            d="M 44 18 C 44 4 0 4 0 32 C 0 66 46 58 46 88 C 46 114 0 114 0 100"/>
      <!-- Letter p -->
      <path fill="none" stroke="#F8FAFC" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
            d="M 72 34 L 72 130 M 72 62 C 72 42 112 42 112 66 C 112 90 72 90 72 72"/>
      <!-- Letter a -->
      <path fill="none" stroke="#F8FAFC" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
            d="M 174 34 L 174 98 M 174 64 C 174 42 134 42 134 66 C 134 90 174 90 174 74"/>
      <!-- Letter n -->
      <path fill="none" stroke="#F8FAFC" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
            d="M 200 34 L 200 98 M 200 58 C 200 36 240 36 240 58 L 240 98"/>
      <!-- Letter l -->
      <line x1="264" y1="0" x2="264" y2="98" stroke="#F8FAFC" stroke-width="18" stroke-linecap="round"/>
      <!-- Letter y -->
      <path fill="none" stroke="#F8FAFC" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
            d="M 286 34 L 314 98 M 342 34 L 300 130"/>
      <!-- Gradient Accent Dot -->
      <circle cx="354" cy="92" r="8" fill="url(#bannerGrad)"/>
    </g>

    <!-- Subtitle Text (Guaranteed max length 460px via textLength, ends at X: 810) -->
    <text x="0" y="152" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" textLength="460" lengthAdjust="spacingAndGlyphs">ELEGANT TIME SPAN SELECTOR FOR ANDROID</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 182)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
      <!-- Pill 1: SpanlyDial -->
      <rect x="0" y="0" width="135" height="34" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <circle cx="18" cy="17" r="5" fill="#818CF8"/>
      <text x="32" y="22" fill="#C7D2FE">SpanlyDial</text>

      <!-- Pill 2: SpanlySlider -->
      <rect x="150" y="0" width="145" height="34" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <circle cx="168" cy="17" r="5" fill="#22D3EE"/>
      <text x="182" y="22" fill="#A5F3FC">SpanlySlider</text>

      <!-- Pill 3: Overnight Span -->
      <rect x="310" y="0" width="165" height="34" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <circle cx="330" cy="17" r="5" fill="#34D399"/>
      <text x="344" y="22" fill="#A7F3D0">OVERNIGHT SPAN</text>
    </g>
  </g>
</svg>
