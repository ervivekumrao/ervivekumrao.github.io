<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 256" width="960" height="256" role="img" aria-labelledby="title">
  <title id="title">Spanly Logo Horizontal Light</title>
  <defs>
    <linearGradient id="spanGradHL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glowHL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- SYMBOL -->
  <g id="symbol" transform="translate(32, 32) scale(0.75)">
    <circle cx="128" cy="128" r="92" fill="none" stroke="#E2E8F0" stroke-width="14" stroke-dasharray="6 6"/>
    <path fill="none" stroke="url(#spanGradHL)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowHL)"
          d="M 172 70 A 46 46 0 0 0 82 84 C 82 118 174 138 174 172 A 46 46 0 0 1 84 186"/>
    <circle cx="172" cy="70" r="15" fill="#FFFFFF" stroke="#6366F1" stroke-width="6"/>
    <circle cx="172" cy="70" r="5" fill="#6366F1"/>
    <circle cx="84" cy="186" r="15" fill="#FFFFFF" stroke="#06B6D4" stroke-width="6"/>
    <circle cx="84" cy="186" r="5" fill="#06B6D4"/>
    <circle cx="128" cy="22" r="3" fill="#94A3B8"/>
    <circle cx="234" cy="128" r="3" fill="#94A3B8"/>
    <circle cx="128" cy="234" r="3" fill="#94A3B8"/>
    <circle cx="22" cy="128" r="3" fill="#94A3B8"/>
  </g>

  <!-- WORDMARK ("Spanly") -->
  <g id="wordmark" fill="#0F172A">
    <!-- Letter S -->
    <path fill="none" stroke="#0F172A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
          d="M 314 64 C 314 50 270 50 270 78 C 270 112 316 104 316 134 C 316 160 270 160 270 146"/>
    <!-- Letter p -->
    <path fill="none" stroke="#0F172A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
          d="M 342 80 L 342 176 M 342 108 C 342 88 382 88 382 112 C 382 136 342 136 342 118"/>
    <!-- Letter a -->
    <path fill="none" stroke="#0F172A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
          d="M 444 80 L 444 144 M 444 110 C 444 88 404 88 404 112 C 404 136 444 136 444 120"/>
    <!-- Letter n -->
    <path fill="none" stroke="#0F172A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
          d="M 470 80 L 470 144 M 470 104 C 470 82 510 82 510 104 L 510 144"/>
    <!-- Letter l -->
    <line x1="534" y1="46" x2="534" y2="144" stroke="#0F172A" stroke-width="16" stroke-linecap="round"/>
    <!-- Letter y -->
    <path fill="none" stroke="#0F172A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
          d="M 556 80 L 584 144 M 612 80 L 570 176"/>
    <!-- Dot -->
    <circle cx="624" cy="138" r="7" fill="url(#spanGradHL)"/>
  </g>

  <!-- TAGLINE ("TIME SPAN SELECTOR") -->
  <g id="tagline" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="5">
    <text x="270" y="212">TIME SPAN SELECTOR</text>
  </g>
</svg>
