<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">Spanly App Icon</title>
  <defs>
    <linearGradient id="bgGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="spanGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Container background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradIcon)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Symbol inside App Icon Container (Scaled to center 256, 256) -->
  <g transform="translate(256, 256) scale(1.4) translate(-128, -128)">
    <circle cx="128" cy="128" r="92" fill="none" stroke="#334155" stroke-width="14" stroke-dasharray="6 6"/>
    <path fill="none" stroke="url(#spanGradIcon)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)"
          d="M 172 70 A 46 46 0 0 0 82 84 C 82 118 174 138 174 172 A 46 46 0 0 1 84 186"/>
    <circle cx="172" cy="70" r="15" fill="#0F172A" stroke="#6366F1" stroke-width="6"/>
    <circle cx="172" cy="70" r="5" fill="#6366F1"/>
    <circle cx="84" cy="186" r="15" fill="#0F172A" stroke="#06B6D4" stroke-width="6"/>
    <circle cx="84" cy="186" r="5" fill="#06B6D4"/>
    <circle cx="128" cy="22" r="3.5" fill="#64748B"/>
    <circle cx="234" cy="128" r="3.5" fill="#64748B"/>
    <circle cx="128" cy="234" r="3.5" fill="#64748B"/>
    <circle cx="22" cy="128" r="3.5" fill="#64748B"/>
  </g>
</svg>
