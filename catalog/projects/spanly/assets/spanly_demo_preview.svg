<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title">
  <title id="title">Spanly UI Components Preview - SpanlyDial and SpanlySlider</title>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="demoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Span Arc Gradient 1 (Indigo to Cyan) -->
    <linearGradient id="spanGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Span Bar Gradient 2 (Cyan to Emerald) -->
    <linearGradient id="spanGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="spanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6366F1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1200" height="600" fill="url(#demoBg)"/>

  <!-- Top Title Banner -->
  <text x="600" y="52" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" letter-spacing="2">SPANLY UI COMPONENTS PREVIEW</text>
  <text x="600" y="82" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Interactive SpanlyDial and SpanlySlider Controls for Android</text>

  <!-- ==================== LEFT CARD: SpanlyDial ==================== -->
  <g transform="translate(60, 110)">
    <!-- Card Container -->
    <rect width="510" height="450" rx="24" fill="url(#cardBg)" stroke="#334155" stroke-width="2"/>

    <!-- Header Title -->
    <rect x="24" y="24" width="150" height="32" rx="10" fill="#6366F1" fill-opacity="0.2" stroke="#6366F1" stroke-width="1"/>
    <text x="99" y="45" fill="#C7D2FE" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🕒 CIRCULAR DIAL</text>
    <text x="190" y="45" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="20" font-weight="700">SpanlyDial</text>

    <!-- Dial Graphics Group (Center at 255, 250) -->
    <g transform="translate(255, 250)">
      <!-- Track Circle (Exact Radius = 125) -->
      <circle cx="0" cy="0" r="125" fill="none" stroke="#334155" stroke-width="16"/>

      <!-- 12 Major Hour Ticks & Labels -->
      <!-- 12 o'clock -->
      <line x1="0" y1="-125" x2="0" y2="-112" stroke="#94A3B8" stroke-width="3"/>
      <text x="0" y="-95" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">12</text>
      <!-- 1 o'clock -->
      <text x="48" y="-84" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">1</text>
      <!-- 2 o'clock -->
      <text x="88" y="-48" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">2</text>
      <!-- 3 o'clock -->
      <line x1="125" y1="0" x2="112" y2="0" stroke="#94A3B8" stroke-width="3"/>
      <text x="98" y="4" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">3</text>
      <!-- 4 o'clock -->
      <text x="88" y="52" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">4</text>
      <!-- 5 o'clock -->
      <text x="48" y="90" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">5</text>
      <!-- 6 o'clock -->
      <line x1="0" y1="125" x2="0" y2="112" stroke="#94A3B8" stroke-width="3"/>
      <text x="0" y="102" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">6</text>
      <!-- 7 o'clock -->
      <text x="-48" y="90" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">7</text>
      <!-- 8 o'clock -->
      <text x="-88" y="52" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">8</text>
      <!-- 9 o'clock -->
      <line x1="-125" y1="0" x2="-112" y2="0" stroke="#94A3B8" stroke-width="3"/>
      <text x="-98" y="4" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">9</text>
      <!-- 10 o'clock -->
      <text x="-88" y="-48" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">10</text>
      <!-- 11 o'clock -->
      <text x="-48" y="-84" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">11</text>

      <!-- Active Span Arc lying EXACTLY on Track Radius = 125 -->
      <!-- Start point 08:30 AM (x=-121, y=32), End point 05:00 PM (x=63, y=108) -->
      <path fill="none" stroke="url(#spanGrad1)" stroke-width="18" stroke-linecap="round" filter="url(#spanGlow)"
            d="M -121 32 A 125 125 0 1 1 63 108"/>

      <!-- Start Thumb Handle (at -121, 32 -> 08:30 AM) -->
      <circle cx="-121" cy="32" r="16" fill="#FFFFFF" stroke="#6366F1" stroke-width="5"/>
      <circle cx="-121" cy="32" r="4" fill="#6366F1"/>

      <!-- End Thumb Handle (at 63, 108 -> 05:00 PM) -->
      <circle cx="63" cy="108" r="16" fill="#FFFFFF" stroke="#06B6D4" stroke-width="5"/>
      <circle cx="63" cy="108" r="4" fill="#06B6D4"/>

      <!-- Center Display Info Badge -->
      <rect x="-85" y="-32" width="170" height="64" rx="14" fill="#0F172A" fill-opacity="0.95" stroke="#334155" stroke-width="1.5"/>
      <text x="0" y="-10" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">SELECTED SPAN</text>
      <text x="0" y="8" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">08:30 AM – 05:00 PM</text>
      <text x="0" y="22" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Duration: 8h 30m</text>
    </g>
  </g>

  <!-- ==================== RIGHT CARD: SpanlySlider ==================== -->
  <g transform="translate(630, 110)">
    <!-- Card Container -->
    <rect width="510" height="450" rx="24" fill="url(#cardBg)" stroke="#334155" stroke-width="2"/>

    <!-- Header Title -->
    <rect x="24" y="24" width="150" height="32" rx="10" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4" stroke-width="1"/>
    <text x="99" y="45" fill="#A5F3FC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">📏 LINEAR SLIDER</text>
    <text x="190" y="45" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="20" font-weight="700">SpanlySlider</text>

    <!-- Linear Slider Controls (Centered Y: 220) -->
    <g transform="translate(40, 190)">
      <!-- Track Background Line -->
      <line x1="0" y1="40" x2="430" y2="40" stroke="#334155" stroke-width="16" stroke-linecap="round"/>

      <!-- Ticks and Labels along line -->
      <line x1="10" y1="20" x2="10" y2="40" stroke="#94A3B8" stroke-width="2"/>
      <text x="10" y="10" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">12 AM</text>

      <line x1="62" y1="26" x2="62" y2="40" stroke="#475569" stroke-width="1.5"/>
      <text x="62" y="10" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">3 AM</text>

      <line x1="115" y1="20" x2="115" y2="40" stroke="#94A3B8" stroke-width="2"/>
      <text x="115" y="10" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">6 AM</text>

      <line x1="168" y1="26" x2="168" y2="40" stroke="#475569" stroke-width="1.5"/>
      <text x="168" y="10" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">9 AM</text>

      <line x1="220" y1="20" x2="220" y2="40" stroke="#94A3B8" stroke-width="2"/>
      <text x="220" y="10" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">12 PM</text>

      <line x1="272" y1="26" x2="272" y2="40" stroke="#475569" stroke-width="1.5"/>
      <text x="272" y="10" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">3 PM</text>

      <line x1="325" y1="20" x2="325" y2="40" stroke="#94A3B8" stroke-width="2"/>
      <text x="325" y="10" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">6 PM</text>

      <line x1="378" y1="26" x2="378" y2="40" stroke="#475569" stroke-width="1.5"/>
      <text x="378" y="10" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">9 PM</text>

      <line x1="420" y1="20" x2="420" y2="40" stroke="#94A3B8" stroke-width="2"/>
      <text x="420" y="10" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">12 AM</text>

      <!-- Active Linear Span Segment (From 9 AM x=168 to 5 PM x=308) -->
      <line x1="168" y1="40" x2="308" y2="40" stroke="url(#spanGrad2)" stroke-width="18" stroke-linecap="round" filter="url(#spanGlow)"/>

      <!-- Start Thumb (x=168, y=40) -->
      <circle cx="168" cy="40" r="16" fill="#FFFFFF" stroke="#06B6D4" stroke-width="5"/>
      <circle cx="168" cy="40" r="4" fill="#06B6D4"/>

      <!-- End Thumb (x=308, y=40) -->
      <circle cx="308" cy="40" r="16" fill="#FFFFFF" stroke="#10B981" stroke-width="5"/>
      <circle cx="308" cy="40" r="4" fill="#10B981"/>

      <!-- Bottom Span Text Card -->
      <g transform="translate(215, 120)">
        <rect x="-110" y="-30" width="220" height="60" rx="14" fill="#0F172A" fill-opacity="0.95" stroke="#334155" stroke-width="1.5"/>
        <text x="0" y="-8" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">SELECTED TIME SPAN</text>
        <text x="0" y="10" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">09:00 AM – 05:00 PM</text>
        <text x="0" y="23" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Total Duration: 8h 00m</text>
      </g>
    </g>
  </g>
</svg>
