<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" rx="20" fill="#0F172A"/>
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <text x="200" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Dual UI Layouts</text>
  <text x="200" y="98" fill="#6366F1" font-family="system-ui, sans-serif" font-weight="500" font-size="11" text-anchor="middle">Radial Clock &amp; Linear Slider Views</text>

  <!-- Radial Clock View -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="240" height="180" rx="16" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
    <text x="120" y="28" fill="#6366F1" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">CIRCULAR RADIAL SELECTOR</text>

    <!-- Radial Ring -->
    <circle cx="120" cy="100" r="50" fill="none" stroke="#334155" stroke-width="10"/>
    <path d="M120 50 A50 50 0 0 1 170 100" fill="none" stroke="#6366F1" stroke-width="10" stroke-linecap="round"/>
    <circle cx="170" cy="100" r="10" fill="#A855F7"/>

    <text x="120" y="166" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Selected: 3h 15m</text>
  </g>

  <!-- Linear Slider View -->
  <g transform="translate(80, 315)">
    <rect x="0" y="0" width="240" height="180" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="120" y="28" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">LINEAR TIME SPAN SLIDER</text>

    <rect x="20" y="85" width="200" height="12" rx="6" fill="#0F172A"/>
    <rect x="50" y="85" width="110" height="12" rx="6" fill="#10B981"/>
    <circle cx="50" cy="91" r="10" fill="#FFFFFF"/>
    <circle cx="160" cy="91" r="10" fill="#FFFFFF"/>

    <text x="120" y="145" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Start: 09:00 AM • End: 05:00 PM</text>
    <text x="120" y="165" fill="#10B981" font-family="system-ui, sans-serif" font-weight="600" font-size="10" text-anchor="middle">Material 3 Themed</text>
  </g>
</svg>
