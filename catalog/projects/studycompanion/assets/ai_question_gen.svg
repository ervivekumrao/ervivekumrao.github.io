<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" rx="20" fill="#0F172A"/>
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <text x="200" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">AI Quiz Generator</text>
  <text x="200" y="98" fill="#10B981" font-family="system-ui, sans-serif" font-weight="500" font-size="11" text-anchor="middle">MCQs, Essay &amp; Short Answer Tests</text>

  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="240" height="380" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="16" y="28" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="11">AI PRACTICE QUIZ (QUESTION 1/5)</text>

    <!-- Question Box -->
    <rect x="16" y="45" width="208" height="60" rx="10" fill="#0F172A"/>
    <text x="26" y="66" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Where do light-dependent</text>
    <text x="26" y="82" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">reactions take place?</text>

    <!-- Options -->
    <!-- A (Correct) -->
    <rect x="16" y="117" width="208" height="38" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5"/>
    <text x="32" y="140" fill="#34D399" font-family="system-ui, sans-serif" font-weight="700" font-size="11">A. Thylakoid Membrane ✓</text>

    <!-- B -->
    <rect x="16" y="163" width="208" height="38" rx="8" fill="#0F172A"/>
    <text x="32" y="186" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">B. Stroma Matrix</text>

    <!-- C -->
    <rect x="16" y="209" width="208" height="38" rx="8" fill="#0F172A"/>
    <text x="32" y="232" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">C. Outer Envelope</text>

    <rect x="16" y="260" width="208" height="100" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="26" y="282" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="11">EXPLANATION</text>
    <text x="26" y="302" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10">Light-dependent reactions utilize chlorophyll in thylakoid membranes to convert light to ATP.</text>
    <text x="26" y="342" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="600" font-size="9">AI Explanation Generated via Gemini Engine</text>
  </g>
</svg>
