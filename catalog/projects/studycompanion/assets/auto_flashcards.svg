<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" rx="20" fill="#0F172A"/>
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <text x="200" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Leitner Flashcards</text>
  <text x="200" y="98" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="500" font-size="11" text-anchor="middle">Spaced Repetition &amp; Active Recall</text>

  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="240" height="380" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="16" y="28" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="700" font-size="11">LEITNER BOX SYSTEM (CARD 12/50)</text>

    <!-- Flashcard Flip Front -->
    <rect x="16" y="45" width="208" height="150" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="120" y="95" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">TERM / CONCEPT</text>
    <text x="120" y="125" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Calvin Cycle</text>
    <text x="120" y="165" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Tap to Flip Card</text>

    <!-- Buttons: Hard / Good / Easy -->
    <g transform="translate(16, 215)">
      <rect x="0" y="0" width="62" height="36" rx="8" fill="#EF4444"/>
      <text x="31" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">Hard</text>

      <rect x="73" y="0" width="62" height="36" rx="8" fill="#F59E0B"/>
      <text x="104" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">Good</text>

      <rect x="146" y="0" width="62" height="36" rx="8" fill="#10B981"/>
      <text x="177" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">Easy</text>
    </g>

    <rect x="16" y="265" width="208" height="95" rx="10" fill="#0F172A"/>
    <text x="26" y="288" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="11">RETENTION ANALYTICS</text>
    <text x="26" y="310" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10">Box 1: 12 • Box 2: 24 • Box 3: 14</text>
    <text x="26" y="330" fill="#10B981" font-family="system-ui, sans-serif" font-weight="600" font-size="10">Spaced Repetition Schedule Active</text>
  </g>
</svg>
