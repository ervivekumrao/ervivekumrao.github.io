<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="16" fill="#0F172A"/>
  <rect x="10" y="10" width="380" height="240" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>

  <!-- Main Section Title -->
  <text x="200" y="34" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">IN-MEMORY COMPILATION &amp; DYNAMIC EXECUTION</text>

  <!-- Code Box -->
  <rect x="20" y="48" width="360" height="96" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="34" y="67" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5">Zero Disk Footprint • Pure RAM Compilation</text>

  <rect x="30" y="75" width="340" height="44" rx="6" fill="#0D1117" stroke="#334155" stroke-width="0.8"/>
  <text x="40" y="91" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9">DynamicCompiler compiler = new InMemoryCompiler();</text>
  <text x="40" y="107" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="9">Object res = compiler.compile(src).invoke("multiply", 6, 7);</text>

  <text x="34" y="134" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">✓ Reflection-free invocation: invoke(), invokeStatic(), newInstance()</text>

  <!-- Bottom Details Banner Box -->
  <rect x="20" y="148" width="360" height="90" rx="10" fill="#0F172A" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="200" y="168" fill="#14B8A6" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Cross-Class Memory Linking</text>
  <text x="200" y="188" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Compiled bytecodes instantly visible to subsequent passes in RAM</text>
  <text x="200" y="206" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Atomic batch compilation (compileBatch) for circular dependencies</text>
  <text x="200" y="224" fill="#10B981" font-family="system-ui, sans-serif" font-weight="600" font-size="9.5" text-anchor="middle">✓ Sub-Millisecond Execution with Zero I/O Overhead</text>
