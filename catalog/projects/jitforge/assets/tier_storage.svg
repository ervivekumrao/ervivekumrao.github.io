<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" rx="20" fill="#0F172A"/>
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <text x="200" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">4-Tier Storage Hierarchy</text>
  <text x="200" y="98" fill="#F43F5E" font-family="system-ui, sans-serif" font-weight="500" font-size="11" text-anchor="middle">Distributed Bytecode Caching</text>

  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="240" height="380" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="16" y="28" fill="#F43F5E" font-family="system-ui, sans-serif" font-weight="700" font-size="11">BYTECODE PERSISTENCE TIERS</text>

    <!-- Tier 1 -->
    <rect x="16" y="45" width="208" height="50" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="26" y="66" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Tier 1: RAM ClassLoader</text>
    <text x="26" y="80" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10">Latency: &lt; 1 µs</text>

    <!-- Tier 2 -->
    <rect x="16" y="105" width="208" height="50" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="26" y="126" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Tier 2: Redis Cache</text>
    <text x="26" y="140" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="10">Latency: &lt; 1 ms</text>

    <!-- Tier 3 -->
    <rect x="16" y="165" width="208" height="50" rx="10" fill="#0F172A"/>
    <text x="26" y="186" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Tier 3: Pod Local Volume</text>
    <text x="26" y="200" fill="#94A3B8" font-family="system-ui, sans-serif" font-weight="600" font-size="10">Latency: 2 - 5 ms</text>

    <!-- Tier 4 -->
    <rect x="16" y="225" width="208" height="50" rx="10" fill="#0F172A"/>
    <text x="26" y="246" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Tier 4: PostgreSQL Database</text>
    <text x="26" y="260" fill="#94A3B8" font-family="system-ui, sans-serif" font-weight="600" font-size="10">Latency: 5 - 15 ms</text>

    <rect x="16" y="285" width="208" height="80" rx="10" fill="#020617" stroke="#F43F5E" stroke-width="1"/>
    <text x="26" y="308" fill="#F43F5E" font-family="system-ui, sans-serif" font-weight="700" font-size="11">AUTO CACHE WARMING</text>
    <text x="26" y="330" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10">Upstream tiers warm automatically on query miss</text>
  </g>
</svg>
