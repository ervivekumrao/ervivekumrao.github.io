<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="16" fill="#0F172A"/>
  <rect x="10" y="10" width="380" height="240" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>

  <!-- Main Section Title -->
  <text x="200" y="34" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">4-TIER DISTRIBUTED BYTECODE STORAGE</text>

  <!-- Grid (2x2) -->
  <rect x="20" y="48" width="172" height="44" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="106" y="65" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">Tier 1: ClassLoader / RAM</text>
  <text x="106" y="81" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">&lt; 1 µs • JVM Process Memory</text>

  <rect x="208" y="48" width="172" height="44" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
  <text x="294" y="65" fill="#EF4444" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">Tier 2: Redis Cache</text>
  <text x="294" y="81" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">&lt; 1 ms • Distributed Pod Cache</text>

  <rect x="20" y="98" width="172" height="44" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="106" y="115" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">Tier 3: Pod Filesystem</text>
  <text x="106" y="131" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">2–5 ms • STORAGE_DIR Volume</text>

  <rect x="208" y="98" width="172" height="44" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="294" y="115" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">Tier 4: PostgreSQL DB</text>
  <text x="294" y="131" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">5–15 ms • Persistent Storage</text>

  <!-- Bottom Details Banner Box -->
  <rect x="20" y="148" width="360" height="90" rx="10" fill="#0F172A" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="200" y="168" fill="#14B8A6" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Automated Upstream Cache Warming</text>
  <text x="200" y="188" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Lower-tier resolution automatically warms Redis &amp; RAM caches</text>
  <text x="200" y="206" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Chain of Responsibility: RAM ➔ Redis ➔ Disk ➔ DB</text>
  <text x="200" y="224" fill="#10B981" font-family="system-ui, sans-serif" font-weight="600" font-size="9.5" text-anchor="middle">✓ Guarantees Sub-Millisecond Warm Cache Hit Latency</text>
</svg>