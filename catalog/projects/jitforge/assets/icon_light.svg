<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 240" width="100%" height="100%">
  <title>JitForge Horizontal Lockup (Light)</title>
  <defs>
    <linearGradient id="ltAnvilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="ltBoltGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="ltTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(25, 10) scale(0.92)">
    <!-- Anvil Silhouette -->
    <path d="M 36 102 C 56 92, 76 86, 96 86 L 214 86 L 214 110 L 184 110 C 166 120, 158 130, 156 142 C 154 160, 168 178, 194 190 L 194 206 L 156 206 C 146 192, 137 186, 128 186 C 119 186, 110 192, 100 206 L 62 206 L 62 190 C 88 178, 102 160, 100 142 C 98 130, 90 120, 72 114 C 56 110, 44 106, 36 102 Z" 
          fill="url(#ltAnvilGrad)" stroke="#0284C7" stroke-width="2.4" stroke-linejoin="round" />
    <!-- Knockout Border -->
    <polygon points="158,22 92,126 138,126 104,234 168,112 122,112" 
             fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linejoin="miter" />
    <!-- Bolt -->
    <polygon points="158,22 92,126 138,126 104,234 168,112 122,112" 
             fill="url(#ltBoltGrad)" />
    <!-- Highlight -->
    <polygon points="158,22 92,126 138,126 104,234 134,126 138,118" 
             fill="#FFFFFF" opacity="0.4" />
    <polygon points="158,22 92,126 138,126 104,234 168,112 122,112" 
             fill="none" stroke="#FFFFFF" stroke-width="1.0" stroke-linejoin="miter" />
  </g>

  <!-- Divider Line -->
  <line x1="255" y1="42" x2="255" y2="198" stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round" />

  <!-- Typography -->
  <g transform="translate(285, 0)">
    <text x="0" y="125" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="82" font-weight="900" letter-spacing="-1.5">
      <tspan fill="#0F172A">Jit</tspan><tspan fill="url(#ltTextGrad)">Forge</tspan>
    </text>
    <text x="4" y="164" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', monospace, sans-serif" 
          font-size="13.5" font-weight="700" letter-spacing="2.8" fill="#0284C7">
      ENTERPRISE IN-MEMORY JIT &amp; BYTECODE ENGINE
    </text>
    <g transform="translate(4, 184)">
      <rect x="0" y="0" width="82" height="22" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
      <text x="41" y="15" font-family="monospace" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">JAVA 21+</text>
      <rect x="90" y="0" width="80" height="22" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
      <text x="130" y="15" font-family="monospace" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">SUB-MS</text>
      <rect x="178" y="0" width="116" height="22" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
      <text x="236" y="15" font-family="monospace" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">ZERO DISK I/O</text>
    </g>
