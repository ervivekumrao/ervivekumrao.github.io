<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="16" fill="#0F172A"/>
  <rect x="10" y="10" width="380" height="240" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>

  <!-- Main Section Title -->
  <text x="200" y="34" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">MULTI-ENGINE JIT &amp; BYTECODE ECOSYSTEM</text>

  <!-- Dialects Grid (3x2) -->
  <rect x="20" y="48" width="112" height="42" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="76" y="65" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="9.5" text-anchor="middle">JAVAC (Standard)</text>
  <text x="76" y="80" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">javax.tools RAM</text>

  <rect x="144" y="48" width="112" height="42" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="200" y="65" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="9.5" text-anchor="middle">JANINO (Fast JIT)</text>
  <text x="200" y="80" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">&lt; 15 ms Latency</text>

  <rect x="268" y="48" width="112" height="42" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="324" y="65" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="700" font-size="9.5" text-anchor="middle">GROOVY Engine</text>
  <text x="324" y="80" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">@CompileStatic</text>

  <rect x="20" y="96" width="112" height="42" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
  <text x="76" y="113" fill="#8B5CF6" font-family="system-ui, sans-serif" font-weight="700" font-size="9.5" text-anchor="middle">Byte Buddy</text>
  <text x="76" y="128" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Proxy Synthesis</text>

  <rect x="144" y="96" width="112" height="42" rx="6" fill="#1E293B" stroke="#06B6D4" stroke-width="1"/>
  <text x="200" y="113" fill="#06B6D4" font-family="system-ui, sans-serif" font-weight="700" font-size="9.5" text-anchor="middle">Javassist</text>
  <text x="200" y="128" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Class Injection</text>

  <rect x="268" y="96" width="112" height="42" rx="6" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
  <text x="324" y="113" fill="#EF4444" font-family="system-ui, sans-serif" font-weight="700" font-size="9.5" text-anchor="middle">MVEL 2</text>
  <text x="324" y="128" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">&lt; 10 µs Expr</text>

  <!-- Bottom Details Banner Box -->
  <rect x="20" y="148" width="360" height="90" rx="10" fill="#0F172A" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="200" y="168" fill="#14B8A6" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Dynamic Per-Request Engine Selection</text>
  <text x="200" y="188" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Select JAVAC, JANINO, or GROOVY per HTTP request</text>
  <text x="200" y="206" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">JSON body: {"compiler":"JANINO"} or header X-Compiler-Engine</text>
  <text x="200" y="224" fill="#10B981" font-family="system-ui, sans-serif" font-weight="600" font-size="9.5" text-anchor="middle">✓ Tailored compilation performance per workload profile</text>
</svg>