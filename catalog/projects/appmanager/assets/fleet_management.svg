<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-fleet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" rx="20" fill="url(#bg-fleet)"/>
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <text x="200" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Fleet Management</text>
  <text x="200" y="98" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="500" font-size="11" text-anchor="middle">Corporate Device Owner Governance</text>

  <!-- Device Cluster Graphic -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="240" height="150" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="16" y="28" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="11">FLEET GOVERNANCE STATUS</text>
    <text x="16" y="55" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="28">128 / 128</text>
    <text x="16" y="74" fill="#10B981" font-family="system-ui, sans-serif" font-weight="600" font-size="11">● All Devices Compliant</text>

    <rect x="16" y="90" width="208" height="44" rx="10" fill="#0F172A"/>
    <text x="28" y="110" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Device Owner Status:</text>
    <text x="28" y="124" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10">DPM AdminReceiver Enforced</text>
