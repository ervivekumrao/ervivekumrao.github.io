    <text x="26" y="117" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Warehouse Scanner Fleet #2</text>
    <text x="26" y="130" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">86 Enterprise Scanners Active</text>

    <rect x="16" y="149" width="208" height="44" rx="8" fill="#0F172A"/>
    <text x="26" y="169" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Policy Version:</text>
    <text x="26" y="182" fill="#10B981" font-family="system-ui, sans-serif" font-size="10">v4.2.0 Sync Complete</text>
