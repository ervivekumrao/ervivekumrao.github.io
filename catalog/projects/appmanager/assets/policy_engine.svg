<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" rx="20" fill="#0F172A"/>
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <text x="200" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Hardware Policy Engine</text>
  <text x="200" y="98" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="500" font-size="11" text-anchor="middle">Password Rules &amp; Lockdowns</text>

  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="240" height="380" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="16" y="28" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="700" font-size="11">SECURITY RULES</text>

    <!-- Rule 1: Password Complexity -->
    <rect x="16" y="45" width="208" height="52" rx="10" fill="#0F172A"/>
    <text x="28" y="66" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Password Complexity</text>
    <text x="28" y="80" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Min 8 chars • Symbols &amp; Numbers</text>
    <circle cx="196" cy="71" r="8" fill="#10B981"/>

    <!-- Rule 2: USB MTP Disable -->
    <rect x="16" y="107" width="208" height="52" rx="10" fill="#0F172A"/>
    <text x="28" y="128" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">USB Data Transfer</text>
    <text x="28" y="142" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">MTP &amp; ADB Debugging Blocked</text>
    <circle cx="196" cy="133" r="8" fill="#EF4444"/>

    <!-- Rule 3: Camera Lockdown -->
    <rect x="16" y="169" width="208" height="52" rx="10" fill="#0F172A"/>
    <text x="28" y="190" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Camera Hardware</text>
    <text x="28" y="204" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Sensors Disabled System-Wide</text>
    <circle cx="196" cy="195" r="8" fill="#EF4444"/>

    <!-- Rule 4: Wipe Protocol -->
    <rect x="16" y="231" width="208" height="52" rx="10" fill="#0F172A"/>
    <text x="28" y="252" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Auto-Wipe on Failed PIN</text>
    <text x="28" y="266" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">5 Failed Attempts Trigger Wipe</text>
    <circle cx="196" cy="257" r="8" fill="#10B981"/>

    <!-- Status Banner -->
    <rect x="16" y="295" width="208" height="65" rx="10" fill="#020617" stroke="#F59E0B" stroke-width="1"/>
    <text x="28" y="320" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="700" font-size="11">🔒 SECURITY ENGINE ACTIVE</text>
    <text x="28" y="338" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Policy enforced by Device Policy Manager</text>
  </g>
</svg>
