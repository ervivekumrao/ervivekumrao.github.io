<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" rx="20" fill="#0F172A"/>
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <text x="200" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Smart Calling Automation</text>
  <text x="200" y="98" fill="#2563EB" font-family="system-ui, sans-serif" font-weight="500" font-size="11" text-anchor="middle">Auto-Dialer Queue &amp; Cooldowns</text>

  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="240" height="150" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="16" y="28" fill="#2563EB" font-family="system-ui, sans-serif" font-weight="700" font-size="11">AUTO-DIALER QUEUE</text>

    <!-- Circular Countdown (10s) -->
    <circle cx="120" cy="85" r="36" fill="none" stroke="#334155" stroke-width="8"/>
    <circle cx="120" cy="85" r="36" fill="none" stroke="#2563EB" stroke-width="8" stroke-dasharray="226" stroke-dashoffset="60" stroke-linecap="round" transform="rotate(-90 120 85)"/>
    <text x="120" y="92" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="800" font-size="20" text-anchor="middle">08s</text>
    <text x="120" y="136" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Next Call Preparation</text>
  </g>

  <g transform="translate(80, 290)">
    <rect x="0" y="0" width="240" height="210" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="16" y="28" fill="#2563EB" font-family="system-ui, sans-serif" font-weight="700" font-size="11">CANDIDATE QUEUE SUMMARY</text>

    <rect x="16" y="45" width="208" height="44" rx="8" fill="#0F172A"/>
    <text x="26" y="65" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Alex Smith (Senior Dev)</text>
    <text x="26" y="78" fill="#10B981" font-family="system-ui, sans-serif" font-size="10">● Dialing Now...</text>

    <rect x="16" y="97" width="208" height="44" rx="8" fill="#0F172A"/>
    <text x="26" y="117" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Sarah Jenkins (UI Lead)</text>
    <text x="26" y="130" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Up Next in Queue</text>

    <rect x="16" y="149" width="208" height="44" rx="8" fill="#0F172A"/>
    <text x="26" y="169" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Queue Controls:</text>
    <text x="26" y="182" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10">Remote Pause / Resume Active</text>
  </g>
</svg>
