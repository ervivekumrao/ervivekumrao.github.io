<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" rx="20" fill="#0F172A"/>
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <text x="200" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">OCR Label Scanning</text>
  <text x="200" y="98" fill="#D81B60" font-family="system-ui, sans-serif" font-weight="500" font-size="11" text-anchor="middle">On-Device ML Kit Text Extraction</text>

  <!-- Scanner Reticle -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="240" height="220" rx="16" fill="#1E293B" stroke="#D81B60" stroke-width="2"/>

    <!-- Bottle Outline -->
    <rect x="85" y="40" width="70" height="110" rx="12" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <rect x="100" y="25" width="40" height="15" rx="4" fill="#334155"/>
    <rect x="95" y="70" width="50" height="50" rx="4" fill="#D81B60" fill-opacity="0.2" stroke="#D81B60" stroke-width="1.5" stroke-dasharray="4"/>

    <!-- Laser Beam -->
    <line x1="10" y1="95" x2="230" y2="95" stroke="#F43F5E" stroke-width="2"/>

    <text x="120" y="180" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Scanning Label...</text>
    <text x="120" y="198" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Google ML Kit Text Recognition</text>
  </g>

  <!-- Extracted Text Result Card -->
  <g transform="translate(80, 355)">
    <rect x="0" y="0" width="240" height="145" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="16" y="24" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="11">EXTRACTED DOSAGE DATA</text>

    <text x="16" y="50" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Name: Lipitor 20mg</text>
    <text x="16" y="70" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Schedule: Take 1 Tablet Daily</text>
    <text x="16" y="90" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Rx Number: #94827104</text>

    <rect x="16" y="105" width="208" height="28" rx="6" fill="#10B981"/>
    <text x="120" y="123" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">✓ Auto-Fill Prescription Details</text>
  </g>
</svg>
