<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" rx="20" fill="#0F172A"/>
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="62" y="42" width="276" height="516" rx="26" fill="#0F172A"/>

  <text x="200" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Smart Geofencing</text>
  <text x="200" y="98" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="500" font-size="11" text-anchor="middle">Background Office Arrival &amp; Exit</text>

  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="240" height="220" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>

    <!-- Map Geofence Circle -->
    <circle cx="120" cy="90" r="50" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4"/>
    <circle cx="120" cy="90" r="8" fill="#F59E0B"/>
    <text x="120" y="115" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Office Geofence (200m)</text>

    <text x="120" y="165" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">● ARRIVED AT OFFICE</text>
    <text x="120" y="185" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">In-Time Logged Automatically: 09:00 AM</text>
  </g>

  <g transform="translate(80, 355)">
    <rect x="0" y="0" width="240" height="145" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1"/>
