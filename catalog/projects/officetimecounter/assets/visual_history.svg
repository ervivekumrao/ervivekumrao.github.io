    <g transform="translate(24, 80)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="24" height="24" rx="4" fill="#10B981"/><text x="12" y="16" fill="#FFF" font-size="9" text-anchor="middle">1</text>
      <rect x="28" y="0" width="24" height="24" rx="4" fill="#10B981"/><text x="40" y="16" fill="#FFF" font-size="9" text-anchor="middle">2</text>
