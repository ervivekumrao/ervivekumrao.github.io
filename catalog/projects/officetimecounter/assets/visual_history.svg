      <rect x="112" y="0" width="24" height="24" rx="4" fill="#10B981"/><text x="124" y="16" fill="#FFF" font-size="9" text-anchor="middle">5</text>
      <rect x="140" y="0" width="24" height="24" rx="4" fill="#334155"/><text x="152" y="16" fill="#94A3B8" font-size="9" text-anchor="middle">6</text>

      <!-- Row 2 -->
      <rect x="0" y="28" width="24" height="24" rx="4" fill="#10B981"/><text x="12" y="44" fill="#FFF" font-size="9" text-anchor="middle">8</text>
      <rect x="28" y="28" width="24" height="24" rx="4" fill="#10B981"/><text x="40" y="44" fill="#FFF" font-size="9" text-anchor="middle">9</text>
      <rect x="56" y="28" width="24" height="24" rx="4" fill="#F59E0B"/><text x="68" y="44" fill="#FFF" font-size="9" text-anchor="middle">10</text>
      <rect x="84" y="28" width="24" height="24" rx="4" fill="#10B981"/><text x="96" y="44" fill="#FFF" font-size="9" text-anchor="middle">11</text>
      <rect x="112" y="28" width="24" height="24" rx="4" fill="#10B981"/><text x="124" y="44" fill="#FFF" font-size="9" text-anchor="middle">12</text>
      <rect x="140" y="28" width="24" height="24" rx="4" fill="#334155"/><text x="152" y="44" fill="#94A3B8" font-size="9" text-anchor="middle">13</text>
