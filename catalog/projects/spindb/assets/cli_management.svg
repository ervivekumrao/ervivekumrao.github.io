<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="16" fill="#0F172A"/>
  <rect x="8" y="8" width="384" height="244" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="200" y="32" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle">UNIFIED DEVELOPER CLI CONTROL (spinctl)</text>

  <!-- Commands Grid -->
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="112" height="38" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="56" y="23" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">spinctl status</text>

    <rect x="124" y="0" width="112" height="38" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="180" y="23" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">spinctl connect</text>

    <rect x="248" y="0" width="112" height="38" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="304" y="23" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">spinctl env</text>

    <rect x="0" y="46" width="112" height="38" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="56" y="69" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">spinctl start</text>

    <rect x="124" y="46" width="112" height="38" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="180" y="69" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">spinctl logs</text>

    <rect x="248" y="46" width="112" height="38" rx="6" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
    <text x="304" y="69" fill="#EF4444" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">spinctl stop / rm</text>
  </g>

  <!-- Interactive Terminal Feature -->
  <g transform="translate(20, 146)">
    <rect x="0" y="0" width="360" height="90" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="180" y="24" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Direct Shell Client &amp; Env Exporter</text>
    <text x="180" y="44" fill="#F8FAFC" font-family="monospace" font-size="9.5">spinctl connect dev-pg ➔ Instant psql CLI inside container</text>
    <text x="180" y="64" fill="#38BDF8" font-family="monospace" font-size="9.5">spinctl env dev-pg     ➔ Exports connection string &amp; .env</text>
    <text x="180" y="80" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">✓ No need to remember engine-specific podman/docker commands</text>
  </g>
</svg>