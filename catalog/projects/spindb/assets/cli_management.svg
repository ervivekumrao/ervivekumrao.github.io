<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="16" fill="#0F172A"/>
  <rect x="10" y="10" width="380" height="240" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>

  <!-- Main Section Title -->
  <text x="200" y="35" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">UNIFIED DEVELOPER CLI CONTROL (spinctl)</text>

  <!-- Commands Grid (3x2) -->
  <!-- Row 1 -->
  <rect x="20" y="50" width="112" height="42" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="76" y="75" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">spinctl status</text>

  <rect x="144" y="50" width="112" height="42" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="200" y="75" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">spinctl connect</text>

  <rect x="268" y="50" width="112" height="42" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="324" y="75" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">spinctl env</text>

  <!-- Row 2 -->
  <rect x="20" y="100" width="112" height="42" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="76" y="125" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">spinctl start</text>

  <rect x="144" y="100" width="112" height="42" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="200" y="125" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">spinctl logs</text>

  <rect x="268" y="100" width="112" height="42" rx="6" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
  <text x="324" y="125" fill="#EF4444" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">spinctl stop / rm</text>

  <!-- Bottom Shell Client Banner Box -->
  <rect x="20" y="152" width="360" height="84" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="200" y="172" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Direct Shell Client &amp; Env Exporter</text>
  <text x="200" y="192" fill="#F8FAFC" font-family="monospace" font-size="9.5" text-anchor="middle">spinctl connect dev-pg ➔ Instant psql CLI inside container</text>
  <text x="200" y="212" fill="#38BDF8" font-family="monospace" font-size="9.5" text-anchor="middle">spinctl env dev-pg     ➔ Exports connection string &amp; .env</text>
</svg>