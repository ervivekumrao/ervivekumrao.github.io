<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="16" fill="#0F172A"/>
  <rect x="8" y="8" width="384" height="244" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="200" y="32" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle">ROOTLESS PODMAN &amp; DOCKER FALLBACK</text>

  <!-- Flow Grid -->
  <g transform="translate(20, 48)">
    <!-- Primary Podman -->
    <rect x="0" y="0" width="170" height="90" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="85" y="24" fill="#8B5CF6" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">🦭 Primary Engine</text>
    <text x="85" y="44" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Podman</text>
    <text x="85" y="62" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Daemonless • Rootless</text>
    <text x="85" y="76" fill="#10B981" font-family="system-ui, sans-serif" font-weight="600" font-size="9" text-anchor="middle">✓ Preferred Default</text>

    <!-- Arrow -->
    <text x="180" y="48" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14">➔</text>

    <!-- Fallback Docker -->
    <rect x="190" y="0" width="170" height="90" rx="10" fill="#1E293B" stroke="#06B6D4" stroke-width="1"/>
    <text x="275" y="24" fill="#06B6D4" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">🐳 Fallback Engine</text>
    <text x="275" y="44" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Docker</text>
    <text x="275" y="62" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Seamless Automatic Fallback</text>
    <text x="275" y="76" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="600" font-size="9" text-anchor="middle">Zero Configuration Needed</text>
  </g>

  <!-- Preflight OS Badge -->
  <rect x="20" y="152" width="360" height="84" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="200" y="174" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Automatic OS Pre-Flight Check (spinctl --preflight)</text>
  <text x="200" y="194" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Detects Ubuntu/Debian, Fedora/RHEL, Arch, Alpine, macOS &amp; WSL</text>
  <text x="200" y="214" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="600" font-size="10" text-anchor="middle">Outputs exact copy-paste package install commands if engines are missing</text>
</svg>