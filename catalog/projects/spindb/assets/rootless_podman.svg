<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="16" fill="#0F172A"/>
  <rect x="10" y="10" width="380" height="240" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>

  <!-- Main Section Title -->
  <text x="200" y="35" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">ROOTLESS PODMAN &amp; DOCKER FALLBACK</text>

  <!-- Flow Grid -->
  <!-- Primary Podman Box -->
  <rect x="20" y="50" width="154" height="90" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="97" y="70" fill="#8B5CF6" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" text-anchor="middle">🦭 Primary Engine</text>
  <text x="97" y="90" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Podman</text>
  <text x="97" y="108" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Daemonless • Rootless</text>
  <text x="97" y="124" fill="#10B981" font-family="system-ui, sans-serif" font-weight="600" font-size="9" text-anchor="middle">✓ Preferred Default</text>

  <!-- Arrow -->
  <text x="194" y="98" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle">➔</text>

  <!-- Fallback Docker Box -->
  <rect x="214" y="50" width="166" height="90" rx="10" fill="#1E293B" stroke="#06B6D4" stroke-width="1"/>
  <text x="297" y="70" fill="#06B6D4" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" text-anchor="middle">🐳 Fallback Engine</text>
  <text x="297" y="90" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Docker</text>
  <text x="297" y="108" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Seamless Auto Fallback</text>
  <text x="297" y="124" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="600" font-size="9" text-anchor="middle">Zero Config Needed</text>

  <!-- Preflight OS Banner Box -->
  <rect x="20" y="154" width="360" height="82" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="200" y="174" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Automatic OS Pre-Flight Check (spinctl --preflight)</text>
  <text x="200" y="194" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Detects Ubuntu/Debian, Fedora/RHEL, Arch, Alpine, macOS &amp; WSL</text>
  <text x="200" y="214" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="600" font-size="10" text-anchor="middle">Outputs exact copy-paste package install commands if engines are missing</text>
</svg>