<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="16" fill="#0F172A"/>
  <rect x="8" y="8" width="384" height="244" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="200" y="32" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle">13 DATABASE &amp; LAKEHOUSE ENGINES</text>

  <!-- Engine Badges -->
  <g transform="translate(20, 48)">
    <!-- Row 1: SQL -->
    <rect x="0" y="0" width="112" height="38" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
    <text x="56" y="23" fill="#3B82F6" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">PostgreSQL / MySQL</text>

    <rect x="124" y="0" width="112" height="38" rx="6" fill="#1E293B" stroke="#00C7F7" stroke-width="1"/>
    <text x="180" y="23" fill="#00C7F7" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">MariaDB / MSSQL</text>

    <rect x="248" y="0" width="112" height="38" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <text x="304" y="23" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">Oracle / DB2</text>

    <!-- Row 2: NoSQL & Cache -->
    <rect x="0" y="46" width="112" height="38" rx="6" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
    <text x="56" y="69" fill="#EF4444" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">Redis / Valkey</text>

    <rect x="124" y="46" width="112" height="38" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="180" y="69" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">MongoDB</text>

    <rect x="248" y="46" width="112" height="38" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
    <text x="304" y="69" fill="#8B5CF6" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">pgvector (AI)</text>
  </g>

  <!-- Analytics & Lakehouse Row -->
  <rect x="20" y="146" width="360" height="90" rx="10" fill="#0F172A" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="180" y="168" fill="#14B8A6" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Analytics &amp; Big Data Lakehouse Engines</text>
  <text x="180" y="188" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">ClickHouse (OLAP) • CockroachDB • Snowflake (DuckDB)</text>
  <text x="180" y="206" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="600" font-size="10" text-anchor="middle">Databricks Engine (Apache Spark + Delta Lake)</text>
  <text x="180" y="224" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Instant provisioning with single command: spinctl -t &lt;engine&gt;</text>
</svg>