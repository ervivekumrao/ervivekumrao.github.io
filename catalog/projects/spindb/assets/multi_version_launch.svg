<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="16" fill="#0F172A"/>
  <rect x="10" y="10" width="380" height="240" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>

  <!-- Main Section Title -->
  <text x="200" y="35" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">VERSION DISCOVERY &amp; CONCURRENT VARIANTS</text>

  <!-- Version Grid (2x2) -->
  <!-- Left Box 1 -->
  <rect x="20" y="50" width="172" height="44" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="106" y="67" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" text-anchor="middle">PostgreSQL 14</text>
  <text x="106" y="83" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">postgres-14-5432 (Port 5432)</text>

  <!-- Right Box 1 -->
  <rect x="208" y="50" width="172" height="44" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="294" y="67" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" text-anchor="middle">PostgreSQL 15</text>
  <text x="294" y="83" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">postgres-15-5433 (Port 5433)</text>

  <!-- Left Box 2 -->
  <rect x="20" y="102" width="172" height="44" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="106" y="119" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" text-anchor="middle">PostgreSQL 16.1</text>
  <text x="106" y="135" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">postgres-16.1-5434 (Port 5434)</text>

  <!-- Right Box 2 -->
  <rect x="208" y="102" width="172" height="44" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="294" y="119" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" text-anchor="middle">PostgreSQL 17</text>
  <text x="294" y="135" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">postgres-17-5435 (Port 5435)</text>

  <!-- Bottom Catalog Banner Box -->
  <rect x="20" y="156" width="360" height="80" rx="10" fill="#0F172A" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="200" y="176" fill="#14B8A6" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Unified Catalog (spinctl versions)</text>
  <text x="200" y="196" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">24h TTL Registry Cache (&lt; 5ms local lookup) • Offline Catalog Support</text>
  <text x="200" y="216" fill="#10B981" font-family="system-ui, sans-serif" font-weight="600" font-size="10" text-anchor="middle">✓ Auto-allocated free host ports for concurrent testing</text>
