<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Agentic Inventory - Brand Symbol Monochrome Black</title>

  <!-- Outer 'A' Legs Silhouette -->
  <path fill="#000000" fill-rule="evenodd" d="M 128 24 L 216 212 L 168 212 L 148 164 L 108 164 L 88 212 L 40 212 Z M 128 68 L 144 104 L 112 104 Z"/>

  <!-- 6px White Channel framing central Pencil 'I' for crisp contrast -->
  <rect x="111" y="94" width="34" height="122" rx="6" fill="#FFFFFF"/>
  <polygon points="128,46 147,98 109,98" fill="#FFFFFF"/>

  <!-- Central Pencil Shaft & Cone Tip in Solid Black -->
  <rect x="115" y="98" width="26" height="114" rx="4" fill="#000000"/>
  <polygon points="128,52 142,98 114,98" fill="#000000"/>

  <!-- White Cone Joint & Lead Point definition -->
  <line x1="114" y1="98" x2="142" y2="98" stroke="#FFFFFF" stroke-width="4"/>
  <polygon points="128,52 133,68 123,68" fill="#FFFFFF"/>

  <!-- Horizontal Stencil Interlocking Line -->
  <line x1="102" y1="134" x2="154" y2="134" stroke="#FFFFFF" stroke-width="5"/>
</svg>